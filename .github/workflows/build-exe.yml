# Собирает ARC-Raiders-Overlay.exe на Windows при каждом изменении кода и публикует его
# в Releases. Ссылка на скачивание всегда одна:
# https://github.com/r4v3r-63/arc-raiders-overlay/releases/latest/download/ARC-Raiders-Overlay.exe
name: Сборка exe

on:
  push:
    branches: [main]
    paths:
      - "arc_overlay/**"
      - "run_overlay.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements.txt pyinstaller

      - name: Собрать exe
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name ARC-Raiders-Overlay
          --icon assets/icon.ico
          --add-data "arc_overlay/data;arc_overlay/data"
          run_overlay.py

      - name: Самопроверка exe
        shell: pwsh
        run: |
          $p = Start-Process dist/ARC-Raiders-Overlay.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Самопроверка не прошла, код $($p.ExitCode)" }

      - name: Опубликовать в Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete exe --cleanup-tag --yes || true
          gh release create exe dist/ARC-Raiders-Overlay.exe \
            --title "ARC Raiders — подсказчик" \
            --notes "Последняя сборка из коммита ${GITHUB_SHA::7}. Скачай ARC-Raiders-Overlay.exe и запусти — установка не нужна." \
            --target "$GITHUB_SHA" \
            --latest
