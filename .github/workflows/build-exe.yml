# Собирает программу на Windows при каждом изменении кода и публикует ZIP в Releases.
# Ссылка на скачивание всегда одна:
# https://github.com/r4v3r-63/arc-raiders-overlay/releases/latest/download/ARC-Raiders-Overlay.zip
#
# Сборка папкой (onedir), а не одним файлом: однофайловый .exe распаковывает себя в %TEMP%
# и запускает вторую копию — антивирусы (например, Касперский) принимают это за троян.
# Загрузчик PyInstaller собирается из исходников по той же причине.
name: Сборка exe

on:
  push:
    branches: [main]
    paths:
      - "arc_overlay/**"
      - "run_overlay.py"
      - "requirements.txt"
      - "assets/**"
      - ".github/workflows/build-exe.yml"
      - ".github/release-notes.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: false  # не прерываем публикацию на полпути — новая сборка подождёт

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Установить зависимости
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip install -r requirements.txt
          pip install --no-binary pyinstaller pyinstaller

      - name: Записать сведения о сборке
        shell: bash
        # По коммиту программа понимает, что на GitHub вышла новая версия.
        run: |
          echo "{\"commit\": \"$GITHUB_SHA\"}" > arc_overlay/data/build_info.json
          cat arc_overlay/data/build_info.json

      - name: Собрать exe
        run: >
          pyinstaller --noconfirm --onedir --windowed
          --name ARC-Raiders-Overlay
          --icon assets/icon.ico
          --version-file assets/version_info.txt
          --collect-all winrt
          --add-data "arc_overlay/data;arc_overlay/data"
          run_overlay.py

      - name: Самопроверка exe
        shell: pwsh
        run: |
          $p = Start-Process dist/ARC-Raiders-Overlay/ARC-Raiders-Overlay.exe -ArgumentList "--self-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Самопроверка не прошла, код $($p.ExitCode)" }

      - name: Проверка распознавания текста
        # На сервере GitHub распознавание текста Windows может быть недоступно или зависать:
        # это предупреждение, а не ошибка — выпуск не блокируем, у игроков оно работает.
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process dist/ARC-Raiders-Overlay/ARC-Raiders-Overlay.exe -ArgumentList "--ocr-test" -PassThru -RedirectStandardOutput ocr.txt
          $null = $p.Handle  # без этого PowerShell не сохраняет код завершения процесса
          if (-not $p.WaitForExit(90000)) {
            try { $p.Kill($true) } catch {}
            Write-Output "::warning::Распознавание текста не ответило за 90 секунд на сервере GitHub"
            exit 0
          }
          Get-Content ocr.txt
          if ($p.ExitCode -ne 0) { Write-Output "::warning::Распознавание текста не прошло на сервере GitHub, код $($p.ExitCode)" }

      - name: Упаковать в ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/ARC-Raiders-Overlay -DestinationPath ARC-Raiders-Overlay.zip

      - name: Опубликовать в Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Один постоянный релиз «latest»: архив заменяется на месте, чтобы ссылка на скачивание
          # не пропадала ни на минуту. (exe — прежнее имя метки, удаляется на случай, если осталось.)
          gh release delete exe --cleanup-tag --yes || true
          BUILD_DATE=$(TZ=Europe/Moscow date "+%d.%m.%Y, %H:%M (МСК)")
          # Скрытая строка с коммитом: по ней программа понимает, что вышла новая сборка.
          { echo "**Сборка от $BUILD_DATE.**"; echo; cat .github/release-notes.md; echo; echo "<!-- commit: $GITHUB_SHA -->"; } > notes.md
          if gh release view latest > /dev/null 2>&1; then
            git push -f origin "$GITHUB_SHA:refs/tags/latest"  # по метке программа узнаёт, что вышла новая версия
            gh release upload latest ARC-Raiders-Overlay.zip --clobber
            gh release edit latest --notes-file notes.md --title "ARC Raiders — подсказчик" --target "$GITHUB_SHA" --latest
          else
            gh release create latest ARC-Raiders-Overlay.zip \
              --title "ARC Raiders — подсказчик" \
              --notes-file notes.md \
              --target "$GITHUB_SHA" \
              --latest
          fi
