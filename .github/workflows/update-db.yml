# Раз в сутки пересобирает встроенную базу квестов из arcraiders-data, arcraiders.wiki
# и оглавления руководства Steam. Если что-то изменилось — коммитит новую базу в main;
# программа у игроков скачивает её сама (arc_overlay/app.py, sync_db).
name: Обновление базы квестов

on:
  schedule:
    - cron: "17 3 * * *"  # каждый день в 03:17 UTC (06:17 по Москве)
  workflow_dispatch:       # кнопка «Run workflow» во вкладке Actions

permissions:
  contents: write
  issues: write  # задача «База отстаёт от игры»

concurrency:
  group: update-db
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Установить зависимости
        run: pip install -r requirements-dev.txt

      - name: Скачать arcraiders-data
        run: git clone --depth 1 https://github.com/RaidTheory/arcraiders-data /tmp/arcraiders-data

      - name: Собрать базу
        run: python tools/build_quest_db.py /tmp/arcraiders-data

      - name: Проверить базу
        timeout-minutes: 5
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y -qq libegl1 libxkbcommon0 libfontconfig1 > /dev/null
          pip install -q -r requirements.txt
          python -m pytest -q  # вся программа с новой базой, а не только сама база

      - name: Закоммитить изменения
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add arc_overlay/data
          if git diff --cached --quiet; then
            echo "База не изменилась" >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Автообновление базы квестов"
            git pull --rebase origin main  # пока собиралась база, в main могли запушить
            git push
            echo "База обновлена: $(git log -1 --format=%h)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Сравнивает дату последнего обновления игры (новости Steam) с датами источников.
      # Если источники отстают больше недели — открывает задачу (придёт уведомление),
      # когда догонят — закрывает её.
      - name: Проверить, не отстаёт ли база от игры
        id: fresh
        continue-on-error: true
        run: python tools/check_freshness.py /tmp/arcraiders-data

      - name: Сообщить, если база отстаёт
        if: steps.fresh.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="База отстаёт от игры"
          existing=$(gh issue list --state open --search "in:title $title" --json number,title \
                       -q ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ "${{ steps.fresh.outputs.lagging }}" = "true" ]; then
            if [ -z "$existing" ]; then
              gh issue create --title "$title" --body-file freshness.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "Источники обновились — база снова не отстаёт от игры."
          fi
